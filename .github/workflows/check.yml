name: Check Nix Flake
on: [push]
jobs:
  check-linux:
    name: Run Flake checks (${{ matrix.system }})
    strategy:
      fail-fast: false # Don't cancel other matrix jobs if one fails
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          # - os: ubuntu-24.04-arm
          #   system: aarch64-linux
          # - os: ubuntu-latest
          #   system: riscv64-linux
    runs-on: ${{ matrix.os }}
    steps: &nix_steps
      - name: Set up Git repository
        uses: actions/checkout@v6.0.2

      - name: Common setup
        uses: ./.github/actions/common-setup
        with:
          github_token: ${{ secrets.ACCESS_TOKEN_GITHUB }}

      - name: Run nix flake check
        run: |
          input_overrides=(
            # The skills repo is private; CI only needs the input to evaluate.
            --override-input agent-skills path:./.github/stubs/agent-skills
          )
          if [[ "$GITHUB_SERVER_URL" == "https://github.com" ]]; then
            input_overrides+=(
              --override-input nix-darwin github:magic0whi/nix-darwin/main
              --override-input dns github:magic0whi/dns.nix
              --override-input dev-flake github:magic0whi/dev-flake
            )
          fi

          # Disable deploy-* since they are very huge and prone to exhaust rate limit
          nix eval "${input_overrides[@]}" .#checks.${{ matrix.system }} \
            --apply builtins.attrNames --json \
            | jq -r '.[] | select(startswith("deploy-") | not) | ".#checks.${{ matrix.system }}.\(.)"' \
            | xargs -I{} nix build "${input_overrides[@]}" --no-link {}

  check-macos:
    name: Run Flake checks (aarch64-darwin)
    # Only run macOS checks on GitHub, skip them on Forgejo
    if: github.server_url == 'https://github.com'
    strategy:
      matrix:
        # Use a dynamic runs-on so Forgejo doesn't hang waiting for a macos runner before evaluating the `if` condition
        os: ${{ fromJSON(github.server_url == 'https://github.com' && '["macos-latest"]' || '["ubuntu-latest"]') }}
        system: [aarch64-darwin]
    runs-on: ${{ matrix.os }}
    steps: *nix_steps
