  # gpg --list-public-keys --with-colons | grep fpr | awk -F: '{print $10}' | head -n1
  - &openpgp 9C635181306E1D7FEA53858775DB252683B07650
  - &Proteus-NUC age1mfs3eh0zwpxse06x5dwg78rp3wmpxe8ag3yvkwmkkgrx7gpea96qglanyz
  - &Proteus-MBP14M4P age1g550pxhfzh6rtj76t6v7dzyrzy02g0kuqz27adml8eq7zw6l4adqvx4pm5
  - &Proteus-Desktop age1yv5rv2s3pgc0pxy03c560lz746s9r2qp3exzqq5m3equ5yjtsexscja2r9
  - &Proteus-NixOS-0 age125zqqjhess357kqc556n8zy7da6tq9hxnn85yzynuhdxlxljhveqcv7gjh
  - &Proteus-NixOS-1 age14peangqx8cc42grlrffkj9n6dvjqp4zkmdxppsh9d5nx5j96256smhsgdn
  - &Proteus-NixOS-2 age1nssmjhktf7gdxatr2mysnf6t0q5e9aqzp6vnvtlxvqw4pr3y7ewslsqq6z
  - &Proteus-NixOS-3 age155dv4g43dcvjg8nk6vtz5njeajakd5zxuqszzvg0qp4rtze9v4nqgxsyxz
  - &Proteus-NixOS-4 age1d5yzdxlkmvnee4sw6tu7rufhugwh4crnkngv07l7avh6phlnl9kqwuyca7
  - &Proteus-NixOS-5 age1pshmyllsv7z5g58nt0caqqclx7utpnffyhu8ndj09dhwpw2flf8sp2rj0r
  - &Proteus-NixOS-6 age19hv34dhqt8rtkwpepz8mdnn7cx6egstqqfl87k2xxhrp7zu7u3rqqg2prr
# TIP: To rotate a encrypted file with new recipients
# updatekeys secrets/syncthing_proteus-nuc.priv.pem.age
# TIP:Use recovery key if lost access to secret keys
# SOPS_AGE_KEY=$(nix run nixpkgs#ssh-to-age -- -private-key -i ~/path/to/recovery.priv.key)
# To encrypt file:
# cat <file> | sops encrypt --filename-override secrets/<file>.sops --output secrets/<file>.sops
anchors:
  cloud: &cloud
    - *Proteus-NixOS-0
    - *Proteus-NixOS-1
    - *Proteus-NixOS-2
    - *Proteus-NixOS-3
    - *Proteus-NixOS-4
    - *Proteus-NixOS-5
    - *Proteus-NixOS-6
  trusted: &trusted
    - *Proteus-Desktop
    - *Proteus-NUC
    - *Proteus-MBP14M4P
  all: &all
    - *Proteus-Desktop
    - *Proteus-NUC
    - *Proteus-MBP14M4P
    - *Proteus-NixOS-0
    - *Proteus-NixOS-1
    - *Proteus-NixOS-2
    - *Proteus-NixOS-3
    - *Proteus-NixOS-4
    - *Proteus-NixOS-5
    - *Proteus-NixOS-6
creation_rules:
  ## BEGIN Common
  - path_regex: secrets/proteus_server\.priv\.pem\.sops$
    key_groups: [{ pgp: [*openpgp], age: *all }]
  # - path_regex: secrets/sb_test\.json\.sops$
  #   key_groups:
  #     - pgp: [*openpgp]
  #       age: [*Proteus-NUC, *Proteus-Desktop, *Proteus-MBP14M4P]
  ## END Common
  ## BEGIN Proteus-NUC
  - path_regex: secrets/secureboot_(PK|KEK|db)\.key\.sops$
    key_groups: [{ pgp: [*openpgp], age: [*Proteus-NUC] }]
  ## END Proteus-NUC
  ## BEGIN Proteus-Desktop
  - path_regex: secrets/Proteus-Desktop_syncthing\.priv\.pem\.sops$
    key_groups: [{ pgp: [*openpgp], age: [*Proteus-Desktop] }]
  ## END Proteus-Desktop
  ## BEGIN Trusted Machines
  # NOTE: a regular user doesn't have access to host ssh key
  - path_regex: secrets/nix_secret\.key\.sops$
    key_groups: [{ pgp: [*openpgp], age: [*Proteus-Desktop] }]
  # Cloud provider credentials for home-manager CLIs (not services)
  - path_regex: secrets/(gcloud|oracle)\.sops\.yaml$
    key_groups: [{ pgp: [*openpgp] }]
  - path_regex: secrets/(oracle_secret\.pem\.sops|gcloud_project-[0-9]+\.secret\.json\.sops)$
    key_groups: [{ pgp: [*openpgp] }]
  ## END Trusted Machines
  ## BEGIN Syncthing (HM)
  # TIP: Encrypt in-place since sops matches inputs files for `path_regex`
  # sops encrypt -i secrets/syncthing_proteus-nuc.priv.pem.age
  # TIP: To edit, run
  # SOPS_AGE_KEY=$(nix run nixpkgs#ssh-to-age -- -private-key -i ~/Secrets/Backup/proteus@agenix-recovery.ssh.priv.key) sops -- edit secrets/syncthing_proteus-nuc.priv.pem.age
  - path_regex: secrets/Proteus-(NUC|MBP14M4P)_syncthing\.priv\.pem\.sops$
    key_groups: [{ pgp: [*openpgp] }]
  ## END Syncthing (HM)
  ## BEGIN Services
  - path_regex: secrets/services/ddclient\.sops\.yaml$
    key_groups: [{ pgp: [*openpgp], age: *cloud }]
  # TODO: MBP's prometheus-exporter lands in a follow-up; *all covers it early.
  - path_regex: secrets/services/(easytier|prometheus-exporter|sing-box|sssd)\.sops\.yaml$
    key_groups: [{ pgp: [*openpgp], age: *all }]
  - path_regex: secrets/services/(authelia|garage|grafana|plane|prometheus)\.sops\.yaml$
    key_groups: [{ pgp: [*openpgp], age: [*Proteus-Desktop] }]
  - path_regex: secrets/services/niks3\.sops\.yaml$
    key_groups: [{ pgp: [*openpgp], age: [*Proteus-Desktop] }]
  # Used by the niks3 server on Desktop and the cache uploader on NUC/MBP.
  - path_regex: secrets/services/niks3_shared\.sops\.yaml$
    key_groups: [{ pgp: [*openpgp], age: *trusted }]
  - path_regex: secrets/services/authelia_oidc_rsa\.pem\.sops$
    key_groups: [{ pgp: [*openpgp], age: [*Proteus-Desktop] }]
  # Desktop-only services
  - path_regex: secrets/services/(aria2|atuin|bind|firecrawl|forgejo|homebox|hostapd|nextcloud|opensearch-dashboards|papra|postgresql)\.sops\.yaml$
    key_groups: [{ pgp: [*openpgp], age: [*Proteus-Desktop] }]
  # NUC-only services
  - path_regex: secrets/services/(forgejo-runner|hass|immich|paperless)\.sops\.yaml$
    key_groups: [{ pgp: [*openpgp], age: [*Proteus-NUC] }]
  # Restic: the repo password and S3 credentials differ per host
  - path_regex: secrets/services/restic_Proteus-Desktop\.sops\.yaml$
    key_groups: [{ pgp: [*openpgp], age: [*Proteus-Desktop] }]
  - path_regex: secrets/services/restic_Proteus-NUC\.sops\.yaml$
    key_groups: [{ pgp: [*openpgp], age: [*Proteus-NUC] }]
  # Cloud garage cluster
  - path_regex: secrets/services/garage_cloud\.sops\.yaml$
    key_groups: [{ pgp: [*openpgp], age: *cloud }]
  # Home-manager services: dev machines only, no age recipient
  - path_regex: secrets/services/(anki|claude-code|github|llama-server|mcp)\.sops\.yaml$
    key_groups: [{ pgp: [*openpgp] }]
## END Services
